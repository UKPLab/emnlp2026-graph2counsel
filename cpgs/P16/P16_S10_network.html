
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Interactive Process Network</title>
    <script src="https://unpkg.com/cytoscape@3.21.1/dist/cytoscape.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #cy {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .legend {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
        }
        .tooltip {
            position: absolute;
            background: #fefefe;
            border: 1px solid #aaa;
            padding: 10px;
            font-family: sans-serif;
            font-size: 13px;
            max-width: 300px;
            z-index: 20;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            cursor: default;
        }
        .tooltip .close-btn {
            float: right;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="cy"></div>
    <div class="legend">
        <b>Legend</b><br>
        <span style="color:#e74c3c;">Red</span>: Inhibitory<br>
        <span style="color:#3498db;">Blue</span>: Excitatory<br>
        <hr>
        <b>Dimensions</b><br>
        🔵 Cognition<br>
        🟢 Sense of Self<br>
        🔴 (Overt) Behaviour<br>
        🟣 Affect<br>
        🟠 Context/Moderators<br>
        🟡 Attention<br>
        ⚪ Biophysiological<br>
        🟤 Motivation<br>
        ⚫ Sociocultural
    </div>
    <script>
        var cy = cytoscape({
            container: document.getElementById('cy'),
            layout: { name: 'cose' },
            style: [
                {
                    selector: 'node',
                    style: {
                        'shape': 'roundrectangle',
                        'label': 'data(label)',
                        'text-wrap': 'wrap',
                        'text-max-width': 120,
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'background-color': '#ffffff',
                        'border-color': '#000000',
                        'border-width': 1,
                        'color': '#000',
                        'font-size': 14,
                        'padding': '20px',
                        'width': 'label',
                        'height': 'label'
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'curve-style': 'bezier',
                        'target-arrow-shape': 'triangle',
                        'arrow-scale': 1.2,
                        'label': '',
                        'font-size': 9,
                        'text-rotation': 'autorotate',
                        'text-margin-y': -10,
                        'line-color': 'data(color)',
                        'target-arrow-color': 'data(color)',
                        'width': 'data(width)',
                        'line-style': 'data(lineStyle)'
                    }
                }
            ],
            elements: [{"data": {"id": "Tension between desire for intellectual connection and dissatisfaction with current social circle", "label": "Tension between desire for intellectual connection and dissatisfaction with current social circle\n\ud83d\udfe3 \ud83d\udd35 \ud83d\udfe0\nw = 10"}}, {"data": {"id": "Difficulty navigating relationships with people who have different values or intellectual levels", "label": "Difficulty navigating relationships with people who have different values or intellectual levels\n\ud83d\udd34 \ud83d\udfe3 \ud83d\udfe1\nw = 10"}}, {"data": {"id": "Fear of settling for less in relationships and life choices", "label": "Fear of settling for less in relationships and life choices\n\ud83d\udd34 \u26aa \ud83d\udd35\nw = 10"}}, {"data": {"id": "Struggle to balance self-care and productivity", "label": "Struggle to balance self-care and productivity\n\ud83d\udd34 \ud83d\udfe3 \ud83d\udfe1\nw = 10"}}, {"data": {"id": "Tendency to prioritize others' needs over own needs", "label": "Tendency to prioritize others' needs over own needs\n\ud83d\udd34 \ud83d\udfe3 \u26aa\nw = 10"}}, {"data": {"id": "Tension between desire for intellectual connection and dissatisfaction with current social circle_Difficulty navigating relationships with people who have different values or intellectual levels_17", "source": "Tension between desire for intellectual connection and dissatisfaction with current social circle", "target": "Difficulty navigating relationships with people who have different values or intellectual levels", "pair_label": "17", "info": "Increased tension fuels difficulty navigating relationships.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Tension between desire for intellectual connection and dissatisfaction with current social circle_Fear of settling for less in relationships and life choices_18", "source": "Tension between desire for intellectual connection and dissatisfaction with current social circle", "target": "Fear of settling for less in relationships and life choices", "pair_label": "18", "info": "Mutual reinforcement of high standards", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Difficulty navigating relationships with people who have different values or intellectual levels_Tension between desire for intellectual connection and dissatisfaction with current social circle_4", "source": "Difficulty navigating relationships with people who have different values or intellectual levels", "target": "Tension between desire for intellectual connection and dissatisfaction with current social circle", "pair_label": "4", "info": "Navigating relationships with people of different values or\nintellectual levels can fuel tension between the desire for\nintellectual connection and dissatisfaction with the current\nsocial circle.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Struggle to balance self-care and productivity_Tendency to prioritize others' needs over own needs_11", "source": "Struggle to balance self-care and productivity", "target": "Tendency to prioritize others' needs over own needs", "pair_label": "11", "info": "Self-neglect.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Fear of settling for less in relationships and life choices_Difficulty navigating relationships with people who have different values or intellectual levels_5", "source": "Fear of settling for less in relationships and life choices", "target": "Difficulty navigating relationships with people who have different values or intellectual levels", "pair_label": "5", "info": "Heightened standards", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Tendency to prioritize others' needs over own needs_Struggle to balance self-care and productivity_15", "source": "Tendency to prioritize others' needs over own needs", "target": "Struggle to balance self-care and productivity", "pair_label": "15", "info": "Overemphasizing others' needs can lead to neglect of one's\nown, thereby exacerbating the struggle to balance self-care\nand productivity.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}]
        });

        let tooltipCounter = 0;

        cy.on('tap', 'edge', function(evt) {
            var edge = evt.target;
            var pos = evt.renderedPosition;
            var tooltipId = "tooltip-" + (++tooltipCounter);

            var tooltip = document.createElement("div");
            tooltip.className = "tooltip";
            tooltip.id = tooltipId;
            tooltip.style.left = (pos.x + 20) + "px";
            tooltip.style.top = (pos.y + 20) + "px";

            var closeBtn = document.createElement("span");
            closeBtn.className = "close-btn";
            closeBtn.innerHTML = "&times;";
            closeBtn.onclick = function () {
                tooltip.remove();
            };

            tooltip.innerHTML = "";
            tooltip.appendChild(closeBtn);
            var content = document.createElement("div");
            content.innerHTML = edge.data("info");
            tooltip.appendChild(content);

            document.body.appendChild(tooltip);
            makeDraggable(tooltip);
        });

        function makeDraggable(elmnt) {
            let offset = { x: 0, y: 0 };
            let isDragging = false;

            elmnt.addEventListener("mousedown", function (e) {
                if (e.target.classList.contains("close-btn")) return;
                isDragging = true;
                offset.x = e.clientX - elmnt.offsetLeft;
                offset.y = e.clientY - elmnt.offsetTop;
                elmnt.style.cursor = "move";
                e.preventDefault();
            });

            document.addEventListener("mousemove", function (e) {
                if (isDragging) {
                    elmnt.style.left = (e.clientX - offset.x) + "px";
                    elmnt.style.top = (e.clientY - offset.y) + "px";
                }
            });

            document.addEventListener("mouseup", function () {
                isDragging = false;
                elmnt.style.cursor = "default";
            });
        }
    </script>
</body>
</html>
