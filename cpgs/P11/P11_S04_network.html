 is tied to their sense of self-worth.", "pair_label": "18", "info": "Emotional regulation through relationships can enhance\nemotional intimacy.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "The client's emotional experience is influenced by their expectations of others._The client's emotional reasoning is a coping mechanism for feelings of overwhelm and anxiety._2", "source": "The client's emotional experience is influenced by their expectations of others.", "target": "The client's emotional reasoning is a coping mechanism for feelings of overwhelm and anxiety.", "pair_label": "2", "info": "Emotional experience influences emotional reasoning.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "The client's emotional experience is influenced by their expectations of others._The client's emotional regulation is impacted by their relationships._4", "source": "The client's emotional experience is influenced by their expectations of others.", "target": "The client's emotional regulation is impacted by their relationships.", "pair_label": "4", "info": "Shared underlying social dynamics", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "The client's emotional experience is influenced by their expectations of others._The client's emotional reasoning is a defense mechanism for feelings of vulnerability._3", "source": "The client's emotional experience is influenced by their expectations of others.", "target": "The client's emotional reasoning is a defense mechanism for feelings of vulnerability.", "pair_label": "3", "info": "Expectations shape reasoning.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "The client's emotional reasoning is a defense mechanism for feelings of vulnerability._The client's emotional reasoning is a coping mechanism for feelings of overwhelm and anxiety._15", "source": "The client's emotional reasoning is a defense mechanism for feelings of vulner ed to their sense of self-worth._The client's emotional regulation is impacted by their relationships._8", "source": "The client's emotional intimacy is tied to their sense of self-worth.", "target": "The client's emotional regulation is impacted by their relationships.", "pair_label": "8", "info": "Emotional intimacy affects emotional regulation.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}]
        });

        let tooltipCounter = 0;

        cy.on('tap', 'edge', function(evt) {
            var edge = evt.target;
            var pos = evt.renderedPosition;
            var tooltipId = "tooltip-" + (++tooltipCounter);

            var tooltip = document.createElement("div");
            tooltip.className = "tooltip";
            tooltip.id = tooltipId;
            tooltip.style.left = (pos.x + 20) + "px";
            tooltip.style.top = (pos.y + 20) + "px";

            var closeBtn = document.createElement("span");
            closeBtn.className = "close-btn";
            closeBtn.innerHTML = "&times;";
            closeBtn.onclick = function () {
                tooltip.remove();
            };

            tooltip.innerHTML = "";
            tooltip.appendChild(closeBtn);
            var content = document.createElement("div");
            content.innerHTML = edge.data("info");
            tooltip.appendChild(content);

            document.body.appendChild(tooltip);
            makeDraggable(tooltip);
        });

        function makeDraggable(elmnt) {
            let offset = { x: 0, y: 0 };
            let isDragging = false;

            elmnt.addEventListener("mousedown", function (e) {
                if (e.target.classList.contains("close-btn")) return;
                isDragging = true;
                offset.x = e.clientX - elmnt.offsetLeft;
                offset.y = e.clientY - elmnt.offsetTop;
                elmnt.style.cursor = "move";
                e.preventDefault();
            });

            document.addEventListener("mousemove", function (e) {
                if (isDragging) {
                    elmnt.style.left = (e.clientX - offset.x) + "px";
                    elmnt.style.top = (e.clientY - offset.y) + "px";
                }
            });

            document.addEventListener("mouseup", function () {
                isDragging = false;
                elmnt.style.cursor = "default";
            });
        }
    </script>
