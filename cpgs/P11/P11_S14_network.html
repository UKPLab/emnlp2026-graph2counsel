        #cy {
            width: 100vw;

            display: block;
        }
        .legend {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
        }
        .tooltip {
            position: absolute;
            background: #fefefe;
            border: 1px solid #aaa;
            padding: 10px;
            font-family: sans-serif;
            font-size: 13px;
            max-width: 300px;
            z-index: 20;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            cursor: default;
        }
        .tooltip .close-btn {
            float: right;
            font-weight: bold;
            cursor: pointer;
        }

yle": "solid"}}, {"data": {"id": "Impact of self-blame as a coping mechanism for feelings of overwhelm and anxiety._Assessing the role of thoughts in emotional experiences and developing self-compassion._16", "source": "Impact of self-blame as a coping mechanism for feelings of overwhelm and anxiety.", "target": "Assessing the role of thoughts in emotional experiences and developing self-compassion.", "pair_label": "16", "info": "Self-blame can hinder self-compassion.", "color": "#e74c3c", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Evaluating the effectiveness of emotional regulation strategies in relationships._Difficulty in recognizing the impact of reframed thoughts on emotional experiences._12", "source": "Evaluating the effectiveness of emotional regulation strategies in relationships.", "target": "Difficulty in recognizing the impact of reframed thoughts on emotional experiences.", "pair_label": "12", "info": "Ineffective emotional regulation strategies can hinder the\nrecognition of reframed thoughts' impact on emotional\nexperiences.", "color": "#e74c3c", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Evaluating the effectiveness of emotional regulation strategies in relationships._Assessing the role of thoughts in emotional experiences and developing self-compassion._11", "source": "Evaluating the effectiveness of emotional regulation strategies in relationships.", "target": "Assessing the role of thoughts in emotional experiences and developing self-compassion.", "pair_label": "11", "info": "Emotional regulation strategies often involve cognitive\nreappraisal, which is closely linked to assessing the role\nof thoughts in emotional experiences.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Assessing the role of thoughts in emotional experiences and developing self-compassion._Difficulty in recognizing the impact of reframed thoughts on emotional experiences._1", "source": "Assessing the role of thoughts in emotional experiences and developing self-compassion.", "target": "Difficulty in recognizing the impact of reframed thoughts on emotional experiences.", "pair_label": "1", "info": "Self-compassion development hinders recognition of reframed\nthoughts impact.", "color": "#e74c3c", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Assessing the role of thoughts in emotional experiences and developing self-compassion._Impact of self-blame as a coping mechanism for feelings of overwhelm and anxiety._3", "source": "Assessing the role of thoughts in emotional experiences and developing self-compassion.", "target": "Impact of self-blame as a coping mechanism for feelings of overwhelm and anxiety.", "pair_label": "3", "info": "Promoting self-compassion may reduce self-blame.", "color": "#e74c3c", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Assessing the role of thoughts in emotional experiences and developing self-compassion._Evaluating the effectiveness of emotional regulation strategies in relationships._2", "source": "Assessing the role of thoughts in emotional experiences and developing self-compassion.", "target": "Evaluating the effectiveness of emotional regulation strategies in relationships.", "pair_label": "2", "info": "Developing self-compassion enhances emotional regulation.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}]
        });

        let tooltipCounter = 0;

        cy.on('tap', 'edge', function(evt) {
            var edge = evt.target;
            var pos = evt.renderedPosition;
            var tooltipId = "tooltip-" + (++tooltipCounter);

            var tooltip = document.createElement("div");
            tooltip.className = "tooltip";
            tooltip.id = tooltipId;
            tooltip.style.left = (pos.x + 20) + "px";
            tooltip.style.top = (pos.y + 20) + "px";

            var closeBtn = document.createElement("span");
            closeBtn.className = "close-btn";
            closeBtn.innerHTML = "&times;";
            closeBtn.onclick = function () {
                tooltip.remove();
            };

            tooltip.innerHTML = "";
            tooltip.appendChild(closeBtn);
            var content = document.createElement("div");
            content.innerHTML = edge.data("info");
            tooltip.appendChild(content);

            document.body.appendChild(tooltip);
            makeDraggable(tooltip);
        });

        function makeDraggable(elmnt) {
            let offset = { x: 0, y: 0 };
            let isDragging = false;

            elmnt.addEventListener("mousedown", function (e) {
                if (e.target.classList.contains("close-btn")) return;
                isDragging = true;
                offset.x = e.clientX - elmnt.offsetLeft;
                offset.y = e.clientY - elmnt.offsetTop;
                elmnt.style.cursor = "move";
                e.preventDefault();
            });

            document.addEventListener("mousemove", function (e) {
                if (isDragging) {
                    elmnt.style.left = (e.clientX - offset.x) + "px";
                    elmnt.style.top = (e.clientY - offset.y) + "px";
                }
            });

            document.addEventListener("mouseup", function () {
                isDragging = false;
                elmnt.style.cursor = "default";
            });
        }
